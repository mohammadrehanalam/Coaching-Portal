<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel - Student & Marks Portal</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f6f9; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 25px; max-width: 600px; }
        h2 { color: #333; margin-top: 0; }
        input, button { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; }
        button { background-color: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #218838; }
        .blue-btn { background-color: #007bff; }
        .blue-btn:hover { background-color: #0069d9; }
    </style>
</head>
<body>

    <h1>Admin Dashboard</h1>

    <!-- Form 1: Add New Student -->
    <div class="card">
        <h2>1. Add New Student</h2>
        <input type="text" id="newRoll" placeholder="Roll Number (e.g. 102)">
        <input type="text" id="newName" placeholder="Student Name (e.g. Amit Sharma)">
        <input type="password" id="newPassword" placeholder="Set Student Password">
        <button class="blue-btn" onclick="addStudent()">Add Student</button>
    </div>

    <!-- Form 2: Upload Marks & Copy Link -->
    <div class="card">
        <h2>2. Upload Test Result & Copy Link</h2>
        <input type="text" id="resRoll" placeholder="Student Roll Number (e.g. 102)">
        <input type="text" id="resTestName" placeholder="Test Name (e.g. Mathematics Chapter 1)">
        <input type="text" id="resDate" placeholder="Test Date (e.g. 20 Sep 2026)">
        <input type="number" id="resObtained" placeholder="Marks Obtained">
        <input type="number" id="resTotal" placeholder="Total Marks">
        <input type="text" id="resPdf" placeholder="Google Drive / Cloud PDF Link of Checked Copy">
        <button onclick="addResult()">Upload Score & Copy</button>
    </div>

    <script>
       
    // Direct Access Check
    if (sessionStorage.getItem('adminSessionToken') !== 'logged_in') {
        window.location.href = '/admin-login.html';
    }

    function logoutAdmin() {
        sessionStorage.removeItem('adminSessionToken');
        window.location.href = '/admin-login.html';
    }

        async function addStudent() {
            const roll_number = document.getElementById('newRoll').value;
            const name = document.getElementById('newName').value;
            const password = document.getElementById('newPassword').value;

            const res = await fetch('/api/admin/add-student', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ roll_number, name, password })
            });

            const data = await res.json();
            alert(data.message);
        }

        async function addResult() {
            const student_roll = document.getElementById('resRoll').value;
            const test_name = document.getElementById('resTestName').value;
            const test_date = document.getElementById('resDate').value;
            const marks_obtained = document.getElementById('resObtained').value;
            const total_marks = document.getElementById('resTotal').value;
            const pdf_url = document.getElementById('resPdf').value;

            const res = await fetch('/api/admin/add-result', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ student_roll, test_name, test_date, marks_obtained, total_marks, pdf_url })
            });

            const data = await res.json();
            alert(data.message);
        }
    </script>
</body>
</html>
