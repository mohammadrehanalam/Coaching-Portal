<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coaching Student Portal - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #4f46e5, #06b6d4);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h2 {
            color: #1e293b;
            font-size: 24px;
            margin-bottom: 8px;
        }

        .login-header p {
            color: #64748b;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #334155;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
        }

        .captcha-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-top: 5px;
            background: #f8fafc;
            padding: 6px 12px;
            border: 1px dashed #cbd5e1;
            border-radius: 8px;
        }

        .btn-reload {
            background: #e2e8f0;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            color: #334155;
            transition: background 0.2s ease;
        }

        .btn-reload:hover {
            background: #cbd5e1;
        }

        .forgot-link {
            text-align: right;
            margin-top: -10px;
            margin-bottom: 15px;
        }

        .forgot-link a {
            font-size: 13px;
            color: #4f46e5;
            text-decoration: none;
            font-weight: 600;
        }

        .forgot-link a:hover {
            text-decoration: underline;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: #4338ca;
        }

        .alert-error {
            background: #fee2e2;
            color: #dc2626;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 15px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-header">
            <h2>Student Portal</h2>
            <p>Log in to view your result and answer sheet</p>
        </div>

        <div id="error-msg" class="alert-error">Invalid Credentials or CAPTCHA!</div>

        <form id="loginForm">
            <div class="form-group">
                <label for="rollNumber">Roll Number / Student ID</label>
                <input type="text" id="rollNumber" placeholder="e.g. STU101" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <!-- Forgot Password Link -->
            <div class="forgot-link">
                <a href="/forgot-password">Forgot Password?</a>
            </div>

            <!-- CAPTCHA Section -->
            <div class="form-group">
                <label for="captcha-input">Enter CAPTCHA</label>
                <div class="captcha-container">
                    <span id="captcha-img">Loading...</span>
                    <button type="button" class="btn-reload" onclick="loadCaptcha()">🔄 Reload</button>
                </div>
                <input type="text" id="captcha-input" name="captcha" required style="margin-top: 8px;" placeholder="Type the characters above">
            </div>

            <button type="submit" class="btn-submit">Login</button>
        </form>
    </div>

    <script>
        // Captcha load function
        function loadCaptcha() {
            fetch('/api/captcha')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('captcha-img').innerHTML = data.captcha;
                    document.getElementById('captcha-input').value = '';
                })
                .catch(err => console.error('Error loading captcha:', err));
        }

        // DOM load hone par captcha call
        document.addEventListener('DOMContentLoaded', loadCaptcha);

        // Login form submit handling
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const rollNumber = document.getElementById('rollNumber').value;
            const password = document.getElementById('password').value;
            const captcha = document.getElementById('captcha-input').value;

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ rollNumber, password, captcha })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    localStorage.setItem('studentToken', data.token);
                    localStorage.setItem('studentName', data.student.name);
                    window.location.href = 'dashboard.html';
                } else {
                    document.getElementById('error-msg').innerText = data.message || 'Login failed!';
                    document.getElementById('error-msg').style.display = 'block';
                    loadCaptcha(); // Reset captcha on error
                }
            } catch (err) {
                alert('Server Not Responding!');
            }
        });
    </script>
</body>
</html>
