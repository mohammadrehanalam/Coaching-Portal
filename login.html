<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coaching Student Portal - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #4f46e5, #06b6d4);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h2 {
            color: #1e293b;
            font-size: 24px;
            margin-bottom: 8px;
        }

        .login-header p {
            color: #64748b;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #334155;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
        }

        .captcha-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-top: 5px;
            background: #f8fafc;
            padding: 6px 12px;
            border: 1px dashed #cbd5e1;
            border-radius: 8px;
        }

        .btn-reload {
            background: #e2e8f0;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            color: #334155;
            transition: background 0.2s ease;
        }

        .btn-reload:hover {
            background: #cbd5e1;
        }

        .forgot-link {
            text-align: right;
            margin-top: -10px;
            margin-bottom: 15px;
        }

        .forgot-link a {
            font-size: 13px;
            color: #4f46e5;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        .forgot-link a:hover {
            text-decoration: underline;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: #4338ca;
        }

        .alert-error {
            background: #fee2e2;
            color: #dc2626;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 15px;
            display: none;
        }

        .alert-success {
            background: #dcfce7;
            color: #166534;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 15px;
            display: none;
        }

        /* Modal Popup Styles for Forgot Password */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 380px;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 12px;
            right: 16px;
            font-size: 20px;
            cursor: pointer;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-header">
            <h2>Student Portal</h2>
            <p>Log in to view your result and answer sheet</p>
        </div>

        <div id="error-msg" class="alert-error">Invalid Credentials or CAPTCHA!</div>

        <form id="loginForm">
            <div class="form-group">
                <label for="rollNumber">Roll Number / Student ID</label>
                <input type="text" id="rollNumber" placeholder="e.g. STU101" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <!-- Forgot Password Link -->
            <div class="forgot-link">
                <a onclick="openForgotModal()">Forgot Password?</a>
            </div>

            <!-- CAPTCHA Section -->
            <div class="form-group">
                <label for="captcha-input">Enter CAPTCHA</label>
                <div class="captcha-container">
                    <span id="captcha-img">Loading...</span>
                    <button type="button" class="btn-reload" onclick="loadCaptcha()">🔄 Reload</button>
                </div>
                <input type="text" id="captcha-input" name="captcha" required style="margin-top: 8px;" placeholder="Type the characters above">
            </div>

            <button type="submit" class="btn-submit">Login</button>
        </form>
    </div>

    <!-- Forgot Password Modal -->
    <div id="forgotModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeForgotModal()">&times;</span>
            <h3 style="margin-bottom: 15px; color: #1e293b;">Reset Password</h3>
            
            <div id="modal-msg" class="alert-error"></div>
            <div id="modal-success" class="alert-success"></div>

            <!-- Step 1: Request OTP -->
            <form id="otpReqForm">
                <div class="form-group">
                    <label for="resetEmail">Registered Email</label>
                    <input type="email" id="resetEmail" placeholder="Enter your email" required>
                </div>
                <button type="submit" id="btnSendOtp" class="btn-submit">Send OTP</button>
            </form>

            <!-- Step 2: Verify OTP & New Password (Hidden Initially) -->
            <form id="resetPassForm" style="display: none;">
                <div class="form-group">
                    <label for="otpInput">Enter 6-digit OTP</label>
                    <input type="text" id="otpInput" placeholder="e.g. 123456" required>
                </div>
                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-submit">Update Password</button>
            </form>
        </div>
    </div>

    <script>
        // Captcha load function
        function loadCaptcha() {
            fetch('/api/captcha')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('captcha-img').innerHTML = data.captcha;
                    document.getElementById('captcha-input').value = '';
                })
                .catch(err => console.error('Error loading captcha:', err));
        }

        // DOM load hone par captcha call
        document.addEventListener('DOMContentLoaded', loadCaptcha);

        // Login form submit handling
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const rollNumber = document.getElementById('rollNumber').value;
            const password = document.getElementById('password').value;
            const captcha = document.getElementById('captcha-input').value;

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ rollNumber, password, captcha })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    localStorage.setItem('studentToken', data.token || 'logged_in');
                    localStorage.setItem('studentName', data.student.name);
                    window.location.href = 'dashboard.html';
                } else {
                    document.getElementById('error-msg').innerText = data.message || 'Login failed!';
                    document.getElementById('error-msg').style.display = 'block';
                    loadCaptcha(); // Reset captcha on error
                }
            } catch (err) {
                alert('Server Not Responding!');
            }
        });

        // --- Forgot Password Modal Logic ---
        function openForgotModal() {
            document.getElementById('forgotModal').style.display = 'flex';
            document.getElementById('otpReqForm').style.display = 'block';
            document.getElementById('resetPassForm').style.display = 'none';
            document.getElementById('modal-msg').style.display = 'none';
            document.getElementById('modal-success').style.display = 'none';
        }

        function closeForgotModal() {
            document.getElementById('forgotModal').style.display = 'none';
        }

        // Send OTP Handle
        document.getElementById('otpReqForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('resetEmail').value;
            const btn = document.getElementById('btnSendOtp');

            btn.innerText = 'Sending OTP...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/student/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();

                if (data.success) {
                    document.getElementById('modal-msg').style.display = 'none';
                    document.getElementById('modal-success').innerText = data.message;
                    document.getElementById('modal-success').style.display = 'block';
                    
                    document.getElementById('otpReqForm').style.display = 'none';
                    document.getElementById('resetPassForm').style.display = 'block';
                } else {
                    document.getElementById('modal-msg').innerText = data.message;
                    document.getElementById('modal-msg').style.display = 'block';
                }
            } catch (err) {
                document.getElementById('modal-msg').innerText = 'Failed to connect to server';
                document.getElementById('modal-msg').style.display = 'block';
            } finally {
                btn.innerText = 'Send OTP';
                btn.disabled = false;
            }
        });

        // Verify OTP & Reset Password Handle
        document.getElementById('resetPassForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('resetEmail').value;
            const otp = document.getElementById('otpInput').value;
            const newPassword = document.getElementById('newPassword').value;

            try {
                const res = await fetch('/api/student/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, otp, newPassword })
                });
                const data = await res.json();

                if (data.success) {
                    alert(data.message);
                    closeForgotModal();
                } else {
                    document.getElementById('modal-msg').innerText = data.message;
                    document.getElementById('modal-msg').style.display = 'block';
                }
            } catch (err) {
                alert('Server Connection Error!');
            }
        });
    </script>
</body>
</html>
