<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Secure Admin Gateway</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a2e; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #16213e; padding: 30px; border-radius: 10px; width: 380px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); color: #fff; }
        h2 { text-align: center; margin-bottom: 20px; color: #00fff5; }
        label { font-size: 13px; color: #a2a8d3; }
        input { width: 100%; padding: 10px; margin: 6px 0 15px 0; border-radius: 5px; border: 1px solid #0f3460; background: #0f3460; color: #fff; box-sizing: border-box; }
        button { width: 100%; padding: 11px; background: #e94560; color: white; border: none; font-weight: bold; border-radius: 5px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #c0354c; }
        .captcha-box { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .captcha-code { background: #0f3460; padding: 8px 15px; font-weight: bold; letter-spacing: 4px; font-size: 18px; color: #00fff5; border-radius: 4px; user-select: none; }
        .refresh-btn { background: transparent; color: #00fff5; border: 1px solid #00fff5; width: auto; padding: 5px 10px; margin: 0; font-size: 12px; }
        .forgot-link { display: block; text-align: right; font-size: 12px; color: #00fff5; text-decoration: none; margin-top: -10px; margin-bottom: 15px; cursor: pointer; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; }
        .modal-content { background: #16213e; padding: 25px; border-radius: 8px; width: 320px; color: #fff; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Admin Gateway</h2>
        
        <label>Admin Username</label>
        <input type="text" id="adminId" placeholder="Enter Admin Username">

        <label>Password</label>
        <input type="password" id="adminPass" placeholder="Enter Password">

        <!-- Captcha -->
        <label>Security Captcha</label>
        <div class="captcha-box">
            <span class="captcha-code" id="captchaText">XXXXX</span>
            <button class="refresh-btn" type="button" onclick="generateCaptcha()">↻ Refresh</button>
        </div>
        <input type="text" id="captchaInput" placeholder="Enter Captcha Code">

        <span class="forgot-link" onclick="openForgotModal()">Forgot Password?</span>

        <button onclick="loginAdmin()">Secure Login</button>
        <p id="msg" style="color: #ff6b6b; font-size: 13px; text-align: center; margin-top: 10px;"></p>
    </div>

    <!-- Forgot Password Modal -->
    <div class="modal" id="forgotModal">
        <div class="modal-content">
            <h3 style="margin-top:0; color:#00fff5;">Reset Password</h3>
            
            <div id="step1">
                <label>Admin Email ID</label>
                <input type="email" id="resetEmail" placeholder="Enter Registered Email">
                <button onclick="sendOTP()">Send OTP</button>
            </div>

            <div id="step2" style="display: none;">
                <label>Enter 6-Digit OTP</label>
                <input type="text" id="otpInput" placeholder="123456">
                <label>New Password</label>
                <input type="password" id="newAdminPass" placeholder="Enter New Password">
                <button onclick="verifyAndReset()">Reset Password</button>
            </div>

            <button style="background: #444; margin-top: 10px;" onclick="closeForgotModal()">Cancel</button>
            <p id="modalMsg" style="color: #ff6b6b; font-size: 12px; margin-top: 8px;"></p>
        </div>
    </div>

    <script>
        let currentCaptcha = "";

        function generateCaptcha() {
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
            currentCaptcha = "";
            for (let i = 0; i < 5; i++) {
                currentCaptcha += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            document.getElementById('captchaText').innerText = currentCaptcha;
        }

        window.onload = generateCaptcha;

        async function loginAdmin() {
            const admin_id = document.getElementById('adminId').value;
            const password = document.getElementById('adminPass').value;
            const captcha = document.getElementById('captchaInput').value;

            if (captcha.toUpperCase() !== currentCaptcha) {
                document.getElementById('msg').innerText = "Invalid Captcha Code!";
                generateCaptcha();
                return;
            }

            const res = await fetch('/api/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ admin_id, password })
            });

            const data = await res.json();
            if (data.success) {
                sessionStorage.setItem('adminSessionToken', 'logged_in');
                window.location.href = '/admin.html';
            } else {
                document.getElementById('msg').innerText = data.message;
                generateCaptcha();
            }
        }

        function openForgotModal() { document.getElementById('forgotModal').style.display = 'flex'; }
        function closeForgotModal() { document.getElementById('forgotModal').style.display = 'none'; }

        async function sendOTP() {
            const email = document.getElementById('resetEmail').value;
            document.getElementById('modalMsg').innerText = "Sending OTP...";
            
            const res = await fetch('/api/admin/forgot-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });

            const data = await res.json();
            if (data.success) {
                document.getElementById('step1').style.display = 'none';
                document.getElementById('step2').style.display = 'block';
                document.getElementById('modalMsg').innerText = "OTP sent to your email!";
            } else {
                document.getElementById('modalMsg').innerText = data.message;
            }
        }

        async function verifyAndReset() {
            const email = document.getElementById('resetEmail').value;
            const otp = document.getElementById('otpInput').value;
            const newPassword = document.getElementById('newAdminPass').value;

            const res = await fetch('/api/admin/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, otp, newPassword })
            });

            const data = await res.json();
            if (data.success) {
                alert("Password reset successful! Please login.");
                closeForgotModal();
            } else {
                document.getElementById('modalMsg').innerText = data.message;
            }
        }
    </script>
</body>
</html>
